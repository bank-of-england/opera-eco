name: Package quality

# Run quality checks for pull requests, branch pushes, or a manual run.
on:
  pull_request:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out"
        required: false
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Tests, package, lint, documentation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs,modules,notebooks,test]"

      - name: Build and inspect distribution
        run: |
          python -m build
          python -m twine check dist/*

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Check Marimo notebook
        run: marimo check --strict examples/illustration_marimo.py

      - name: Check generated notebook documentation
        run: |
          marimo export md examples/illustration_marimo.py \
            --output docs/notebooks/illustration.md \
            --flavor pymdown \
            --force
          git diff --exit-code -- docs/notebooks/illustration.md

      - name: Check documentation
        run: zensical build --clean --strict

      - name: Verify pinned module versions
        run: >-
          pytest
          src/opera/tests/skills_tests/test_skill_api.py::test_installed_versions_match_manifest

      - name: Check generated skill APIs
        run: |
          opera skills sync-api
          git diff --exit-code -- src/opera/skills

      - name: Execute skill snippets
        run: pytest -n auto -m skill_snippet

      - name: Run contract tests
        run: pytest -n auto -m contract

      - name: Run pipeline snapshots
        run: pytest -n auto -m pipeline
