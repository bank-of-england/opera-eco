name: Synchronise dev after main merge

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: sync-dev-after-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-dev:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: main

      - name: Reset dev to main
        env:
          MERGED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"

          if ! git push --force-with-lease="refs/heads/dev:${MERGED_PR_HEAD_SHA}" \
            origin "${main_sha}:refs/heads/dev"; then
            echo "::error::Could not reset dev. Check for newer commits or branch restrictions, then synchronise manually."
            exit 1
          fi
