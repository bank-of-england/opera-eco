repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check
        language: system
        types: [python]
      - id: pydoclint
        name: Pydoclint (NumPy style)
        entry: pydoclint --style=numpy
        language: system
        types: [python]
      - id: marimo-check
        name: Marimo notebook check
        entry: marimo check --strict examples/illustration_marimo.py
        language: system
        pass_filenames: false
        files: ^(examples/illustration_marimo\.py|docs/notebooks/illustration\.md)$
