# Zensical configuration.

[project]

site_name = "OPERA Ecosystem"
site_description = "Open-source Prediction, Evaluation and Real-time Analysis"
site_author = "Bank of England"
site_url = "https://bank-of-england.github.io/opera-eco/"
copyright = "Copyright &copy; Bank of England"

nav = [
  { "Home" = "index.md" },
  { "Modules" = [
    { "Forecast Evaluation" = "modules/forecast_evaluation.md" }, 
    { "Real-time Forecasting" = "modules/forecast_realtime.md" }, 
    { "BVAR" = "modules/bvar.md" },
    { "SC-MIDAS" = "modules/sc_midas.md" },
    { "Forecast Combination" = "modules/forecast_combo.md" },
    { "News Decomposition" = "modules/news_decomp.md" },
    { "OPERA Ecosystem" = "modules/opera_eco.md" }
    ] },
  { "Notebooks" = [
    { "Illustration" = "notebooks/illustration.md" },
    ] },
  { "How To" = [
    { "Getting Started" = "guide/getting_started.md" },
    { "Add a Model" = "guide/adding_a_model.md" },
    { "Backtest Models" = "guide/backtest_models.md" },
    { "Combine Forecasts" = "guide/combine_forecasts.md" },
    { "Evaluate Forecasts" = "guide/evaluate_forecasts.md" },
    { "Example Pipeline" = "guide/example_pipeline.md" },
    ] },
  { "Ecosystem Testing" = [
    { "Overview" = "testing.md" },
    { "In Detail" = "testing_details.md" },
    ] },
]

# Configure MathJax rendering.
extra_javascript = [
  "javascripts/mathjax.js",
  { url = "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js", async = true },
]

# Configure the theme.

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.tables]
